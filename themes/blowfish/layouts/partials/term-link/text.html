<article class="w-full px-2 my-3 sm:w-1/2 lg:w-1/3">
  <h2 class="flex items-baseline min-w-0">
    <a
      class="min-w-0 text-xl font-medium break-normal decoration-primary-500 hover:underline hover:underline-offset-2"
      href="{{ .Page.RelPermalink }}"
    >
      {{ .Page.Title }}
    </a>

    {{ if site.Params.taxonomy.showTermCount | default true }}
      <span class="shrink-0 px-2 text-base text-primary-500">&middot;</span>
      <span class="shrink-0 text-base text-neutral-400">
        {{ .Count }}
      </span>
    {{ end }}
  </h2>
</article>
