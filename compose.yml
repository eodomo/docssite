services:
    hugosite:
        image: hugo-ericolerudcom:latest

        build:
            context: .
            dockerfile: Dockerfile
            pull: true
        
        restart: unless-stopped
        container_name: ericolerudcom

        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.hugo.rule=Host(`eric.olerud.com`)"
            - "traefik.http.routers.hugo.entrypoints=websecure"
            - "traefik.http.routers.hugo.tls.certresolver=myresolver"
            - "traefik.http.services.hugo.loadbalancer.server.port=80"

        networks:
            - traefik

networks:
    traefik:
        external: true
